<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2030"/>
      <stop offset="1" stop-color="#0b0d15"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".55" stop-color="#f6c246"/>
      <stop offset="1" stop-color="#e79c1c"/>
    </linearGradient>
  </defs>

  <!-- 배경: 앱 테마(다크 네이비) 전체 채움 — 마스커블 안전 -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 적립·쌓기: 금화 3개가 위로 쌓이는 스택 -->
  <!-- 아래 동전 -->
  <ellipse cx="256" cy="346" rx="122" ry="31" fill="#a56d0a"/>
  <rect x="134" y="320" width="244" height="26" fill="#b87b0d"/>
  <ellipse cx="256" cy="320" rx="122" ry="31" fill="url(#coin)"/>
  <ellipse cx="256" cy="320" rx="122" ry="31" fill="none" stroke="#fff3cf" stroke-opacity=".22" stroke-width="3"/>

  <!-- 가운데 동전 -->
  <ellipse cx="256" cy="286" rx="122" ry="31" fill="#a56d0a"/>
  <rect x="134" y="260" width="244" height="26" fill="#b87b0d"/>
  <ellipse cx="256" cy="260" rx="122" ry="31" fill="url(#coin)"/>
  <ellipse cx="256" cy="260" rx="122" ry="31" fill="none" stroke="#fff3cf" stroke-opacity=".22" stroke-width="3"/>

  <!-- 위 동전 -->
  <ellipse cx="256" cy="226" rx="122" ry="31" fill="#a56d0a"/>
  <rect x="134" y="200" width="244" height="26" fill="#b87b0d"/>
  <ellipse cx="256" cy="200" rx="122" ry="31" fill="url(#coin)"/>
  <ellipse cx="256" cy="200" rx="122" ry="31" fill="none" stroke="#fff3cf" stroke-opacity=".3" stroke-width="3"/>

  <!-- 하이라이트 -->
  <ellipse cx="214" cy="192" rx="46" ry="11" fill="#fff7dc" opacity=".5"/>
</svg>
