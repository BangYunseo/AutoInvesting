name: Daily Trading Run

# 매일 한국시간(KST) 23:40 에 자동 매매 사이클을 실행한다.
# GitHub Actions 는 UTC 기준이므로 KST 23:40 = UTC 14:40 로 설정한다.
# (미장 개장: 여름 22:30 / 겨울 23:30 KST → 23:40은 연중 개장 후라 "장시작전" 거부를 피한다.)
# Render 무료 인스턴스는 잠들어 있으므로, 먼저 /api/health 를 폴링해 깨운 뒤
# 깨어난 것이 확인되면 /api/order/daily-run 을 호출한다 (콜드 스타트 100% 흡수).
on:
  schedule:
    - cron: '40 14 * * *'   # KST 23:40 (UTC 14:40)
  workflow_dispatch:          # 수동 실행(테스트)용 버튼

jobs:
  daily-run:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://autoinvesting.onrender.com
    steps:
      # ── 1) Render 인스턴스 깨우기 (Healthy 응답이 올 때까지 폴링) ──
      - name: Wake Render instance
        run: |
          echo "Render 인스턴스를 깨우는 중... (/api/health 폴링)"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/api/health" || echo "000")
            echo "시도 $i/30: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ 서버가 깨어났습니다."
              exit 0
            fi
            sleep 10
          done
          echo "❌ 5분 내에 서버가 깨어나지 않았습니다. (Render 상태 확인 필요)"
          exit 1

      # ── 2) 일일 매매 사이클 트리거 (매매 + 리밸런싱 + AI 평가 + 리포트 메일) ──
      - name: Trigger daily cycle
        env:
          API_KEY: ${{ secrets.CRON_API_KEY }}
        run: |
          echo "일일 사이클 호출 중... (POST /api/order/daily-run)"
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 \
            -X POST \
            -H "x-api-key: $API_KEY" \
            "$BASE_URL/api/order/daily-run")
          echo "응답 코드: HTTP $code"
          echo "응답 본문: $(cat /tmp/resp.txt)"
          if [ "$code" = "202" ] || [ "$code" = "200" ]; then
            echo "✅ 일일 사이클을 시작했습니다. 매매 결과와 운용 리포트는 이메일로 확인하세요."
          else
            echo "❌ 일일 사이클 호출 실패 (HTTP $code)"
            exit 1
          fi
