name: Daily Trading Run

# 매일 한국시간(KST) 23:40 에 적립식(DCA) 매수 사이클을 실행한다.
# GitHub Actions 는 UTC 기준이므로 KST 23:40 = UTC 14:40 로 설정한다.
# (미장 개장: 여름 22:30 / 겨울 23:30 KST → 23:40은 연중 개장 후라 "장시작전" 거부를 피한다.)
# Render 무료 인스턴스는 잠들어 있으므로, 먼저 /api/health 를 폴링해 깨운 뒤
# 깨어난 것이 확인되면 /api/order/dca-run 을 호출한다 (콜드 스타트 100% 흡수).
on:
  schedule:
    - cron: '40 14 * * *'   # KST 23:40 (UTC 14:40) — 현재 매일 실행
    # ⚠️ [실거래 전환 시 필수] 지금은 모의투자 계좌라 매일 적립해도 무방하다.
    #    실거래 계좌로 바꾸면 월 예산(MonthlyBudgetKrw)을 매일 전액 소진 → ~30배 과매수.
    #    전환 시: cron 을 '40 14 1 * *'(매월 1일)로 바꾸고 엔진에 "이번 달 이미 적립 시 스킵" 가드 추가.
    #    상세: Documents/DEVELOPMENT.md 의 '실거래 전환 시 필수 변경' 참조.
  workflow_dispatch:          # 수동 실행(테스트)용 버튼

jobs:
  daily-run:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://autoinvesting.onrender.com
    steps:
      # ── 1) Render 인스턴스 깨우기 (Healthy 응답이 올 때까지 폴링) ──
      - name: Wake Render instance
        run: |
          echo "Render 인스턴스를 깨우는 중... (/api/health 폴링)"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/api/health" || echo "000")
            echo "시도 $i/30: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ 서버가 깨어났습니다."
              exit 0
            fi
            sleep 10
          done
          echo "❌ 5분 내에 서버가 깨어나지 않았습니다. (Render 상태 확인 필요)"
          exit 1

      # ── 2) 적립식(DCA) 매수 사이클 트리거 (목표비중 향한 정수 매수 + 적립 리포트 메일) ──
      - name: Trigger DCA cycle
        env:
          API_KEY: ${{ secrets.CRON_API_KEY }}
        run: |
          echo "적립식 사이클 호출 중... (POST /api/order/dca-run)"
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 \
            -X POST \
            -H "x-api-key: $API_KEY" \
            "$BASE_URL/api/order/dca-run")
          echo "응답 코드: HTTP $code"
          echo "응답 본문: $(cat /tmp/resp.txt)"
          if [ "$code" = "202" ] || [ "$code" = "200" ]; then
            echo "✅ 적립식 사이클을 시작했습니다. 적립 결과와 리포트는 이메일로 확인하세요."
          else
            echo "❌ 적립식 사이클 호출 실패 (HTTP $code)"
            exit 1
          fi
