name: Daily Trading Run

# 매일 한국시간(KST) 00:10 에 적립식(DCA) 매수 사이클을 호출한다.
# GitHub Actions 는 UTC 기준이므로 KST 00:10 = UTC 15:10 로 설정한다.
#
# ⚠️ 이 시각을 당기지 말 것 (2026-08-03 확정).
#   UTC 15:00 = KST 자정이고 겨울 미장 개장이 UTC 14:30 이므로,
#   "KST 같은 날 + 여름·겨울 모두 장중"인 창은 UTC 14:30~15:00 = 30분뿐이다.
#   GitHub Actions 스케줄 지연은 실측 1시간 41분이었다(크론 UTC 14:40 발화 →
#   실제 집행 KST 2026-08-01 01:21). 30분 창으로는 지연이 KST 자정을 넘겨
#   엔진의 월 판정(KST)이 다음 달로 뒤집히고, 의도한 달과 다른 템플릿이 집행된다.
#   → KST 자정 직후에 두어 월 경계 마진 23시간 50분 / 미장 마감 마진 4시간 50분을 확보한다.
#   → 월 판정 기준은 KST 하나로 통일한다(마커·템플릿·거래내역·메일·화면 전부 KST).
#      ET 기준으로 바꾸면 시스템에 두 번째 시간 기준이 생기고, ET로 세도 월 1회는 동일하다.
#   남는 한계: 조기폐장일(13:00 ET 마감)에 지연이 겹치면 장 마감 후가 될 수 있다.
#      이 경우 체결 0건이라 마커가 남지 않아 다음 날 자동 재시도되므로 치명적이지 않다.
# Render 무료 인스턴스는 잠들어 있으므로, 먼저 /api/health 를 폴링해 깨운 뒤
# 깨어난 것이 확인되면 /api/order/dca-run 을 호출한다 (콜드 스타트 100% 흡수).
#
# ▶ 월 1회 적립 보장 방식(실거래 안전장치): 크론은 매일 호출하지만, 실제 매수는 엔진의 멱등 가드
#   (DailyExecutionService: TB_APP_CONFIG 의 DCA_LAST_RUN_MONTH)가 "이번 달 1회"만 허용한다.
#   → 월초부터 시도해 처음 성공하는 날 1회만 적립되고(예산 1회 소진), 성공 후 그 달 남은 호출은 스킵된다.
#   → 휴장/예수금 부족 등으로 실패(체결 0건)한 날은 마커가 남지 않아 다음 날 자동 재시도된다.
on:
  schedule:
    - cron: '10 15 1-31 * *'   # 매월 1~31일(=매일) KST 00:10 (UTC 15:10). 월 1회 실행은 엔진 가드가 보장.
  workflow_dispatch:          # 수동 실행(테스트)용 버튼

jobs:
  daily-run:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://autoinvesting.onrender.com
    steps:
      # ── 1) Render 인스턴스 깨우기 (Healthy 응답이 올 때까지 폴링) ──
      - name: Wake Render instance
        run: |
          echo "Render 인스턴스를 깨우는 중... (/api/health 폴링)"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/api/health" || echo "000")
            echo "시도 $i/30: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ 서버가 깨어났습니다."
              exit 0
            fi
            sleep 10
          done
          echo "❌ 5분 내에 서버가 깨어나지 않았습니다. (Render 상태 확인 필요)"
          exit 1

      # ── 2) 적립식(DCA) 매수 사이클 트리거 (현재 월 템플릿의 종목별 고정 수량 매수 + 적립 리포트 메일) ──
      - name: Trigger DCA cycle
        env:
          API_KEY: ${{ secrets.CRON_API_KEY }}
        run: |
          echo "적립식 사이클 호출 중... (POST /api/order/dca-run)"
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 \
            -X POST \
            -H "x-api-key: $API_KEY" \
            "$BASE_URL/api/order/dca-run")
          echo "응답 코드: HTTP $code"
          echo "응답 본문: $(cat /tmp/resp.txt)"
          if [ "$code" = "202" ] || [ "$code" = "200" ]; then
            echo "✅ 적립식 사이클을 시작했습니다. 적립 결과와 리포트는 이메일로 확인하세요."
          else
            echo "❌ 적립식 사이클 호출 실패 (HTTP $code)"
            exit 1
          fi
