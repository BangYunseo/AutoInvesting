name: Fill Reconcile

# 미국장 마감 후 체결 대사를 호출한다.
#
# 왜 필요한가: 주문 접수만으로 그 달을 완료로 세면, 지정가가 안 붙어 장 마감에 소멸해도
#   완료로 남아 그 달 적립이 조용히 누락된다. 마감 후 보유 수량 변화로 실제 체결을 판정하고,
#   전량 미체결이면 완료 표시를 해제해 다음 사이클이 다시 시도하게 한다.
#
# 시각: 미장 마감 16:00 ET = UTC 20:00(서머타임) / UTC 21:00(겨울).
#   UTC 21:30 이면 두 경우 모두 마감 뒤이고, 적립 크론(UTC 15:10)과 같은 UTC 날짜 안에 온다.
#   → 그날 주문의 결과를 그날 안에 판정한다.
#
# GitHub Actions 스케줄은 지연될 수 있다(이 저장소 실측 최대 1시간 41분). 지연돼도
#   대사는 읽고 판정만 하므로 늦게 도는 것 자체는 해롭지 않다. 다만 KST 자정을 넘겨
#   달이 바뀌면 스냅샷이 지난 달분이 되어 폐기된다(그 경우 마커는 그대로 남는다).
#
# Render 무료 인스턴스는 잠들어 있으므로 /api/health 로 먼저 깨운다.
on:
  schedule:
    - cron: '30 21 * * *'   # 매일 UTC 21:30 (미장 마감 후). KST 익일 06:30.
  workflow_dispatch:        # 수동 실행(테스트)용 버튼

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://autoinvesting.onrender.com
    steps:
      # ── 1) Render 인스턴스 깨우기 (Healthy 응답이 올 때까지 폴링) ──
      - name: Wake Render instance
        run: |
          echo "Render 인스턴스를 깨우는 중... (/api/health 폴링)"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE_URL/api/health" || echo "000")
            echo "시도 $i/30: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ 서버가 깨어났습니다."
              exit 0
            fi
            sleep 10
          done
          echo "❌ 5분 내에 서버가 깨어나지 않았습니다. (Render 상태 확인 필요)"
          exit 1

      # ── 2) 체결 대사 트리거 (보유 수량 비교 → 상태 갱신 → 전량 미체결이면 재시도 허용) ──
      - name: Trigger reconcile
        env:
          API_KEY: ${{ secrets.CRON_API_KEY }}
        run: |
          echo "체결 대사 호출 중... (POST /api/order/reconcile)"
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 \
            -X POST \
            -H "x-api-key: $API_KEY" \
            "$BASE_URL/api/order/reconcile")
          echo "응답 코드: HTTP $code"
          echo "응답 본문: $(cat /tmp/resp.txt)"
          if [ "$code" = "202" ] || [ "$code" = "200" ]; then
            echo "✅ 체결 대사를 시작했습니다. 결과는 이메일로 확인하세요."
          else
            echo "❌ 체결 대사 호출 실패 (HTTP $code)"
            exit 1
          fi
